name: Deploy to Vercel

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build
      env:
        NODE_OPTIONS: --max-old-space-size=4096
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'placeholder' }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder' }}
        VITE_OPENAI_API_KEY: ${{ secrets.VITE_OPENAI_API_KEY || 'placeholder' }}
        VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY || 'placeholder' }}
        VITE_APP_URL: ${{ secrets.VITE_APP_URL || 'https://localhost:5173' }}
        VITE_APP_NAME: ${{ secrets.VITE_APP_NAME || 'FitFlow AI' }}
        VITE_APP_VERSION: ${{ secrets.VITE_APP_VERSION || '1.0.0' }}

    - name: Comment PR about build success
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `✅ **Build Successful!**
            
            The application has been built successfully and is ready for deployment.
            
            ⚠️ **Note:** Vercel deployment is not configured for this repository.
            To enable automatic deployments, configure these repository secrets:
            - \`VERCEL_TOKEN\`
            - \`VERCEL_ORG_ID\`
            - \`VERCEL_PROJECT_ID\`
            
            You can manually deploy the built application from the \`dist\` folder.`
          });
